services:
  n8n:
    build:
      context: .
      dockerfile: Dockerfile.tester-env
    image: ${IMAGE_TAG:-tester-env-n8n:dev}
    network_mode: bridge
    user: "0:0"
    ports:
      - ${PORT:-18567}:5678
    environment:
      DB_TYPE: sqlite
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_ENCRYPTION_KEY: tester-env-n8n-encryption-key-000
      N8N_HOST: localhost
      N8N_INSTANCE_OWNER_EMAIL: admin@tester.local
      N8N_INSTANCE_OWNER_FIRST_NAME: Tester
      N8N_INSTANCE_OWNER_LAST_NAME: Env
      N8N_INSTANCE_OWNER_MANAGED_BY_ENV: "true"
      N8N_INSTANCE_OWNER_PASSWORD_HASH: $$2b$$10$$AMejmwfCkytv6SuIMe4XNezp8p6dMrEquRWq6phlEu4jEgxQTYuS.
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n-data:/home/node/.n8n

volumes:
  n8n-data:
